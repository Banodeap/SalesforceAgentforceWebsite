<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentforce Chat</title>
  <style>
    :root{color-scheme:light;--brand:#0176d3;--ink:#172033;--muted:#667085;--line:#e5e7eb;--bg:#f3f6fb}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:20px}
    .shell{width:min(100%,820px);height:min(88vh,780px);min-height:520px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #15213b18;display:flex;flex-direction:column;overflow:hidden}
    header{background:#032d60;color:white;padding:20px 24px;display:flex;align-items:center;gap:14px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#ffffff20;font-size:22px}
    h1{margin:0;font-size:19px}.subtitle{margin-top:4px;color:#d8e9ff;font-size:13px}.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:#d8e9ff;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}
    #messages{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}.msg{max-width:min(85%,620px);border-radius:16px;padding:13px 16px;line-height:1.5;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
    .assistant{align-self:flex-start;background:#f0f5fb;border:1px solid #e3eaf3;border-top-left-radius:5px}.user{align-self:flex-end;background:var(--brand);color:white;border-top-right-radius:5px}.system{align-self:center;color:#a12a2a;font-size:12px;padding:5px}
    .typing{color:var(--muted);font-size:13px;padding:0 24px 12px}.suggestions{padding:0 24px 14px;display:flex;gap:8px;flex-wrap:wrap}.suggestions button{border:1px solid #cbd8e8;color:#17436c;background:white;border-radius:18px;padding:8px 12px;cursor:pointer;font-size:12px}
    form{padding:16px 20px 20px;border-top:1px solid var(--line);background:#fff}.composer{display:flex;gap:10px;align-items:flex-end;border:1px solid #cbd5e1;border-radius:16px;padding:8px}
    textarea{border:0;outline:0;resize:none;flex:1;min-height:42px;max-height:140px;padding:10px;font:inherit;font-size:14px;color:var(--ink);background:transparent}#send{border:0;border-radius:11px;background:var(--brand);color:#fff;padding:12px 17px;font-weight:650;cursor:pointer}#send:disabled{opacity:.5;cursor:not-allowed}
    .footnote{color:var(--muted);font-size:11px;text-align:center;padding-top:10px}.newchat{margin-left:12px;color:white;border:1px solid #ffffff66;background:transparent;border-radius:9px;padding:7px 10px;cursor:pointer}
    @media(max-width:560px){body{padding:0}.shell{height:100vh;min-height:0;border-radius:0}.msg{max-width:92%}#messages{padding:16px}header{padding:16px}form{padding:12px}.status{display:none}}
  </style>
</head>
<body>
<main class="shell" aria-label="Agentforce chatbot">
  <header>
    <div class="logo" aria-hidden="true">✦</div>
    <div><h1>Agentforce Assistant</h1><div class="subtitle">Ask a question and I'll do my best to help.</div></div>
    <div class="status"><span class="dot"></span><span id="statusText">Connecting</span></div>
    <button class="newchat" id="newChat" type="button">New chat</button>
  </header>
  <section id="messages" aria-live="polite" aria-label="Chat messages">
    <div class="msg assistant">Hi! I'm your Agentforce assistant. What can I help you with?</div>
  </section>
  <div class="typing" id="typing" hidden>Agentforce is thinking…</div>
  <div class="suggestions" id="suggestions">
    <button type="button">What can you help me with?</button>
    <button type="button">Summarize the key information</button>
  </div>
  <form id="chatForm">
    <div class="composer"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Write your message…" aria-label="Message" required></textarea><button id="send" type="submit">Send ↑</button></div>
    <div class="footnote">Responses are generated by your configured Salesforce Agentforce agent.</div>
  </form>
</main>
<script>
const messagesEl=document.getElementById("messages"),form=document.getElementById("chatForm"),input=document.getElementById("messageInput"),send=document.getElementById("send"),typing=document.getElementById("typing"),statusText=document.getElementById("statusText"),suggestions=document.getElementById("suggestions");
let sessionKey=null,busy=false;
function addMessage(text,role="assistant"){const el=document.createElement("div");el.className=`msg ${role}`;el.textContent=text;messagesEl.appendChild(el);messagesEl.scrollTop=messagesEl.scrollHeight;return el}
async function api(url,options={}){const response=await fetch(url,{headers:{"Content-Type":"application/json"},...options});let data={};if(response.status!==204){try{data=await response.json()}catch{}}if(!response.ok){const error=new Error(data.detail||data.error||`Request failed (${response.status})`);error.status=response.status;throw error}return data}
async function startSession(){statusText.textContent="Connecting";try{const data=await api("/api/session",{method:"POST",body:"{}"});sessionKey=data.sessionKey;statusText.textContent="Connected"}catch(err){statusText.textContent="Unavailable";addMessage(`Could not connect to Salesforce Agentforce. ${err.message}`,"system")}}
async function newChat(){if(busy)return;if(sessionKey){try{await api("/api/session",{method:"DELETE",body:JSON.stringify({sessionKey})})}catch{}}
sessionKey=null;messagesEl.replaceChildren();addMessage("New conversation started. What can I help you with?");await startSession()}
async function sendMessage(text){text=text.trim();if(!text||busy)return;if(!sessionKey){addMessage("The chat is not connected yet. Please try again in a moment.","system");return}
busy=true;send.disabled=true;input.disabled=true;typing.hidden=false;suggestions.hidden=true;addMessage(text,"user");input.value="";input.style.height="auto";
try{const data=await api("/api/chat",{method:"POST",body:JSON.stringify({sessionKey,message:text})});addMessage(data.answer||"No text response was returned.");}
catch(err){if(err.status===410){addMessage("Your session expired. Starting a new chat…","system");await startSession()}else{addMessage(`Sorry, the request failed. ${err.message}`,"system")}}
finally{busy=false;send.disabled=false;input.disabled=false;typing.hidden=true;input.focus()}}
form.addEventListener("submit",e=>{e.preventDefault();sendMessage(input.value)});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
document.getElementById("newChat").addEventListener("click",newChat);
suggestions.addEventListener("click",e=>{if(e.target.tagName==="BUTTON")sendMessage(e.target.textContent)});
fetch("/api/health").then(r=>r.json()).then(d=>{if(!d.configured){statusText.textContent="Setup needed";addMessage("The server needs configuration. Copy .env.example to .env and fill in the Salesforce settings, then restart the server.","system")}else startSession()}).catch(()=>{statusText.textContent="Unavailable";addMessage("Could not reach the Python backend.","system")});
</script>
</body>
</html>
